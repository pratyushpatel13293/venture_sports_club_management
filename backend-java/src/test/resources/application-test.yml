# Tests use an in-memory H2 database in MySQL compatibility mode, so they run anywhere.
spring:
  datasource:
    url: jdbc:h2:mem:venture-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: ""

app:
  jwt:
    access-secret: test-access-secret-that-is-at-least-32-chars
    refresh-secret: test-refresh-secret-that-is-at-least-32-chars
  ai:
    gemini-api-key: ""
