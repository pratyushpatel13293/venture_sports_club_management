# ------------------------------------------------------------------
# All secrets come from environment variables (or a local .env file).
# Copy .env.example to .env and fill it in. Never commit .env.
# ------------------------------------------------------------------
spring:
  application:
    name: venture-sports-backend

  # Reads KEY=value lines from backend-java/.env if the file exists
  # (the Java version of the `dotenv` package the Node backend used).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/venture_sports?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # "update" creates/alters tables automatically from the @Entity classes.
      # Fine for a college project; real companies use migration tools (Flyway/Liquibase).
      ddl-auto: update
    # Keep DB sessions short: everything must be loaded inside @Transactional services.
    open-in-view: false
    properties:
      hibernate:
        # Load lazy collections in batches -> avoids the N+1 query problem.
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
    show-sql: false

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # Must be at least 32 characters (256 bits) for HS256. No default on purpose.
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    # 1 day. Shorter is safer, but two React pages (event.jsx, editevent.jsx) check expiry
    # themselves and send the user to login instead of refreshing, so very short tokens hurt UX.
    access-token-minutes: ${JWT_ACCESS_MINUTES:1440}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}

  # Comma-separated list of frontend origins allowed to call this API (wildcards allowed).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,https://venture-flax.vercel.app}

  mail:
    from: ${MAIL_FROM:no-reply@venture.local}

  otp:
    expiry-minutes: 10
    max-attempts: 5

  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout-seconds: 8

logging:
  level:
    com.venture.sports: INFO
